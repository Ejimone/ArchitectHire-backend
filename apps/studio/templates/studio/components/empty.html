{# Empty state. Always says what is missing and what to do about it. #}
<div class="studio-empty">
    <span class="material-symbols-outlined" style="font-size:28px">{{ icon|default:'inbox' }}</span>
    <p class="studio-empty__title">{{ title }}</p>
    {% if body %}<p class="max-w-md text-sm">{{ body }}</p>{% endif %}
    {% if action_url %}
        <a href="{{ action_url }}" class="mt-2 inline-flex items-center gap-1 text-sm font-medium text-primary-600 hover:underline dark:text-primary-400">
            <span class="material-symbols-outlined md-18">add</span>{{ action_label }}
        </a>
    {% endif %}
</div>
