name: Deploy to Oracle

# Push to main → the app redeploys on its Oracle box, the way App Platform did.
#
# The runner checks the code out, streams it to the box over ssh, and the box
# rebuilds only this app's services and health-checks them, rolling back if
# they do not come up. The box holds no GitHub credential and the deploy key
# can run nothing but that one script.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-architecthire
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship and rebuild
        run: |
          tar -czf - --exclude .git --exclude node_modules --exclude venv \
              --exclude __pycache__ --exclude staticfiles --exclude '*.sqlite3' \
              -C "." . \
          | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
                ubuntu@"${{ secrets.ORACLE_HOST }}" architecthire
