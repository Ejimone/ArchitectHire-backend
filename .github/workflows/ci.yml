name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: architecthire
          POSTGRES_PASSWORD: architecthire
          POSTGRES_DB: architecthire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U architecthire"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://architecthire:architecthire@localhost:5432/architecthire
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret-key
      DJANGO_SETTINGS_MODULE: architecture_backend.settings.test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
