# Production compose — one VM runs the whole backend (Oracle Cloud, Ubuntu, ARM64 or x86).
#
#   Postgres 18 (must match the major version the data was dumped from — the DigitalOcean
#   cluster it migrated off was PG 18; a custom-format dump does not restore across majors)
#   Redis 7   (cache, presence, channels layer)
#   web       Django under gunicorn/uvicorn workers; WEB_CONCURRENCY workers
#   caddy     HTTPS termination with automatic certificates, serves /media/ from disk,
#             proxies everything else (HTTP + WebSocket) to web
#
# Media lives on the host at ${MEDIA_DIR:-/srv/architecthire/media} — bind-mounted so a
# `docker compose down -v` cannot take the agency's photographs with it — and Caddy serves
# it read-only at https://${API_HOST}/media/. Private files (deliverables, credentials)
# live in ${PRIVATE_MEDIA_DIR:-/srv/architecthire/media-private}, which Caddy never sees;
# Django hands out signed, expiring URLs for them.
#
# Compose interpolates ${…} from `--env-file`, and the Django services read the same file
# through `env_file`, so one file holds everything:
#   alias dc='docker compose --env-file .env.prod -f docker-compose.prod.yml'
# First run (see DEPLOY.md for the full runbook):
#   dc build && dc up -d db redis
#   dc run --rm web python manage.py migrate
#   dc run --rm web python manage.py seed --all      # a floor: fills an empty DB only
#   dc up -d
# Every later deploy:
#   git pull && dc build web && dc run --rm web python manage.py migrate && dc up -d web

name: architecthire-prod

x-django: &django
  build: .
  restart: unless-stopped
  env_file: .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: architecture_backend.settings.prod
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgres://${POSTGRES_USER:-architecthire}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-architecthire}
    MEDIA_BACKEND: local
    MEDIA_ROOT: /app/media
    PRIVATE_MEDIA_ROOT: /app/media-private
    MEDIA_URL: https://${API_HOST}/media/
  volumes:
    - ${MEDIA_DIR:-/srv/architecthire/media}:/app/media
    - ${PRIVATE_MEDIA_DIR:-/srv/architecthire/media-private}:/app/media-private
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-architecthire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-architecthire}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-architecthire} -d ${POSTGRES_DB:-architecthire}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published on the host: only the compose network can reach it. Use
    # `docker compose exec db psql -U architecthire` for a shell.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *django
    # Workers are the HTTP concurrency limit (Django runs sync views on one thread per
    # worker). A worker is ~150 MB resident; size WEB_CONCURRENCY to the VM: 2 on a
    # 1 GB box, 4 on 4 GB+, 6-8 on an Always-Free ARM A1 (24 GB).
    command:
      - gunicorn
      - architecture_backend.asgi:application
      - -k
      - uvicorn_worker.UvicornWorker
      - -b
      - 0.0.0.0:8000
      - --workers
      - ${WEB_CONCURRENCY:-4}
      - --max-requests
      - "1000"
      - --max-requests-jitter
      - "200"
      - --graceful-timeout
      - "30"
      - --access-logfile
      - "-"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Background workers are opt-in: notifications and cron jobs run in-process / from
  # Vercel Cron by default (NOTIFY_VIA_CELERY=false). Start them with
  #   docker compose -f docker-compose.prod.yml --profile workers up -d
  # after setting NOTIFY_VIA_CELERY=true in .env.prod.
  worker:
    <<: *django
    profiles: ["workers"]
    command: celery -A architecture_backend worker -l info -Q default,notifications --concurrency 2

  beat:
    <<: *django
    profiles: ["workers"]
    command: celery -A architecture_backend beat -l info

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MEDIA_DIR:-/srv/architecthire/media}:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
