# Production compose — one DigitalOcean droplet runs the whole stack.
#
# Postgres is NOT here: it lives in the owner's existing shared managed cluster
# (create a database for architecthire inside it and point DATABASE_URL at it —
# see DEPLOY.md). Redis stays local to the droplet; it holds only cache,
# queues and presence, nothing that needs managed durability.
#
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm web python manage.py migrate
#   docker compose -f docker-compose.prod.yml run --rm web python manage.py seed --all
#   docker compose -f docker-compose.prod.yml run --rm web python manage.py collectstatic --noinput
#   docker compose -f docker-compose.prod.yml up -d

name: architecthire-prod

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: architecture_backend.settings.prod
      REDIS_URL: redis://redis:6379
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: celery -A architecture_backend worker -l info -Q default,notifications --concurrency 4
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: architecture_backend.settings.prod
      REDIS_URL: redis://redis:6379
    volumes:
      - media:/app/media
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: celery -A architecture_backend beat -l info
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: architecture_backend.settings.prod
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    # The frontend repo sits beside this one on the droplet:
    #   /srv/architecthire/ArchitectHire-backend  (this file)
    #   /srv/architecthire/Architecture-hire
    build:
      context: ../Architecture-hire
      args:
        # NEXT_PUBLIC_* ship to the browser and are baked at build time.
        # API_URL is used server-side during the build's prerender pass, so the
        # backend must be up before building the frontend (DEPLOY.md orders this).
        API_URL: http://web:8000
        NEXT_PUBLIC_API_URL: https://${SITE_HOST}
        NEXT_PUBLIC_SITE_URL: https://${SITE_HOST}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_ENABLE_PUSH: ${NEXT_PUBLIC_ENABLE_PUSH:-1}
        BACKEND_MEDIA_HOST: ${SITE_HOST}
    restart: unless-stopped
    environment:
      API_URL: http://web:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    expose:
      - "3000"
    depends_on:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - frontend

volumes:
  staticfiles:
  media:
  caddy_data:
  caddy_config:
